; ============================================================================
; Projeto NexulTech Leitos Multiplos (6 leitos por ESP32) - PlatformIO
; ============================================================================
; Por que "framework = espidf, arduino" e nao so "arduino"?
; Com framework=arduino puro, o PlatformIO usa as MESMAS bibliotecas
; pre-compiladas do Arduino IDE (nao recompila o lwIP) -- ou seja, o
; sdkconfig abaixo seria ignorado e o NAT continuaria nao funcionando de
; verdade. Com "espidf, arduino", o Arduino roda como um componente DENTRO
; de um projeto ESP-IDF completo, recompilado do zero com IP_FORWARD e
; IPV4_NAPT -- o que falta para o ip_napt_enable() rotear pacotes de
; verdade. Seu codigo (setup/loop, WiFi.h, WebServer.h, PubSubClient,
; Preferences, WiFiUdp) continua igual -- so o build por baixo muda.
; ============================================================================

[platformio]
; Evita que "Upload" (icone de tomada) tente gravar TODAS as placas do
; projeto de uma vez. Selecione o ambiente certo na barra inferior do
; VS Code / aba "PlatformIO > Project Tasks" antes de gravar.
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf, arduino
board_build.sdkconfig = sdkconfig.esp32dev
; WROOM-32 "DevKit" generica = 4MB de flash (confira com esptool se a sua for diferente).
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp32_exception_decoder
upload_flags =
    --before=default_reset
    --after=hard_reset
; Flag propria (nao depende do nome interno que o core Arduino usa para
; identificar a placa) -- usada no main.cpp para escolher o mapa de pinos.
build_flags =
    -D NEXULTECH_BOARD_ESP32DEV=1
lib_deps =
    knolleary/PubSubClient @ ^2.8
; Ajuste a porta conforme sua maquina/USB:
; upload_port = /dev/cu.usbserial-XXXX
; monitor_port = /dev/cu.usbserial-XXXX

[env:wemos_d1_r32]
platform = espressif32
board = wemos_d1_r32
framework = espidf, arduino
board_build.sdkconfig = sdkconfig.wemos_d1_r32
; Wemos D1 R32 (WROVER) = 4MB de flash. Confira com esptool se a sua for diferente.
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -D NEXULTECH_BOARD_WEMOS_D1_R32=1
lib_deps =
    knolleary/PubSubClient @ ^2.8
; Ajuste a porta conforme sua maquina/USB:
; upload_port = /dev/cu.usbserial-XXXX
; monitor_port = /dev/cu.usbserial-XXXX
