; ============================================================================
; Projeto NexulTech Leito - PlatformIO
; ============================================================================
; Por que "framework = espidf, arduino" e nao so "arduino"?
; Com framework=arduino puro, o PlatformIO usa as MESMAS bibliotecas
; pre-compiladas do Arduino IDE (nao recompila o lwIP) -- ou seja, o
; sdkconfig.defaults abaixo seria ignorado e o NAT continuaria nao
; funcionando de verdade.
; Com "espidf, arduino", o Arduino roda como um componente DENTRO de um
; projeto ESP-IDF completo, que e recompilado do zero com as opcoes do
; sdkconfig.defaults -- inclusive IP_FORWARD e IPV4_NAPT, que sao o que
; falta para o ip_napt_enable() rotear pacotes de verdade.
; Seu codigo (setup/loop, WiFi.h, WebServer.h, PubSubClient, Preferences,
; WiFiUdp) continua igual -- so o build por baixo muda.
; ============================================================================

[platformio]
; Evita que "Upload" (icone de tomada) tente gravar TODAS as placas do
; projeto de uma vez. Troque para o nome do ambiente que estiver com a
; placa conectada no momento (ou selecione o ambiente certo na barra
; inferior do VS Code / aba "PlatformIO > Project Tasks" em vez de usar
; esse icone generico).
default_envs = wemos_d1_r32

[env:lolin32_lite]
platform = espressif32
board = lolin32_lite
framework = espidf, arduino
board_build.sdkconfig = sdkconfig.lolin32_lite
; Lolin32 Lite = 2MB de flash (confirmado por log de upload anterior).
board_upload.flash_size = 2MB
board_upload.maximum_size = 2097152
monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    knolleary/PubSubClient @ ^2.8
; Descomente e ajuste se o auto-detect escolher a porta errada:
; upload_port = /dev/cu.usbserial-XXXX
; monitor_port = /dev/cu.usbserial-XXXX

[env:wemos_d1_r32]
platform = espressif32
board = wemos_d1_uno32
framework = espidf, arduino
board_build.sdkconfig = sdkconfig.wemos_d1_r32
; Confirme o tamanho real de flash da sua placa (a maioria e 4MB).
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    knolleary/PubSubClient @ ^2.8
; Porta confirmada via "ls /dev/cu.*":
upload_port = /dev/cu.usbserial-110
monitor_port = /dev/cu.usbserial-110

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf, arduino
board_build.sdkconfig = sdkconfig.esp32dev
; WROOM-32 "DevKit" generica = 4MB de flash (confira com esptool se a sua for diferente).
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp32_exception_decoder
upload_flags =
    --before=default_reset
    --after=hard_reset
lib_deps =
    knolleary/PubSubClient @ ^2.8
; Essa placa tem porta fixa conhecida (o handshake de reset padrao falhava
; sem "upload_flags" acima). Se mudar de porta USB, ajuste aqui:
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
